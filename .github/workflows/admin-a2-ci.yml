name: Admin A2 permission route CI

on:
  push:
    branches: ["feature/admin-redesign-safe-delete-routes"]
  pull_request:
    branches: ["feature/course-groups-flexible-student-routes"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Learn-Monitor/student-database
          ref: feature/admin-redesign-coursegroups
          path: student-database
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build A2 Core API dependency
        working-directory: student-database
        run: ./gradlew shadowJar --no-daemon
      - name: Test and build plugin
        run: |
          core_jar="$(find student-database/build/libs -maxdepth 1 -type f -name 'student-database-v2.0.0-fat.jar' | head -n 1)"
          test -n "$core_jar"
          ./gradlew clean test jar --no-daemon -PstudentDatabaseJar="$core_jar"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check patch formatting
        run: git diff --check
      - name: Create artifact provenance
        id: provenance
        shell: bash
        run: |
          artifact="$(find build/libs -maxdepth 1 -type f -name 'permission-manager-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$artifact"
          sha="$(sha256sum "$artifact" | awk '{print $1}')"
          core_commit="$(git -C student-database rev-parse HEAD)"
          printf 'repository=%s\nbranch=%s\ncommit=%s\ncore_repository=Learn-Monitor/student-database\ncore_branch=feature/admin-redesign-coursegroups\ncore_commit=%s\nfile=%s\nsha256=%s\nrun_id=%s\ntest_status=passed\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$core_commit" "$(basename "$artifact")" "$sha" "$GITHUB_RUN_ID" > build/provenance.txt
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Permission Manager SHA-256: $sha"
      - uses: actions/upload-artifact@v4
        with:
          name: permission-manager-admin-a2-${{ github.sha }}
          path: |
            ${{ steps.provenance.outputs.artifact }}
            build/provenance.txt
          if-no-files-found: error
